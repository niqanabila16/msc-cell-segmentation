[pytest]
testpaths = tests
addopts = -v --tb=short --strict-markers
markers =
    fr01: FR01 - Upload citra dan label dari pengguna
    fr02: FR02 - Pencocokan otomatis citra-label berdasarkan nama file
    fr03: FR03 - Validasi citra input (format & ukuran maksimal)
    fr04: FR04 - Validasi label input (format & ukuran maksimal)
    fr05: FR05 - Inferensi U-Net (dengan/tanpa label)
    fr06: FR06 - Perhitungan metrik evaluasi (IoU, Dice, Precision, Recall, konfluensi)
    fr07: FR07 - Tampilan citra sel, ground truth, prediksi, dan overlay masking
    fr08: FR08 - Visualisasi overlay berwarna TP/FP/FN
    fr09: FR09 - Slider transparansi overlay
    fr10: FR10 - Dropdown opsi preprocessing citra